name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Windows tests & packaging smoke test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-release.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"

      - name: Install pinned FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --version=9.0.1 -y --no-progress

          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg\tools" -Recurse -Filter "ffmpeg.exe" -File |
            Where-Object { $_.Length -gt 1000000 } |
            Select-Object -First 1

          if (-not $ffmpeg) {
            throw "Could not locate the pinned ffmpeg.exe installed by Chocolatey."
          }

          $ffprobe = Join-Path $ffmpeg.Directory.FullName "ffprobe.exe"
          if (-not (Test-Path $ffprobe)) {
            throw "Could not locate ffprobe.exe next to ffmpeg.exe."
          }

          "FFMPEG_BIN_DIR=$($ffmpeg.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned release dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-release.txt
          pip check

      - name: Verify runtime versions
        shell: pwsh
        run: |
          python --version
          python -c "from version import __version__; print('App version:', __version__)"
          node --version
          & "$env:FFMPEG_BIN_DIR\ffmpeg.exe" -version
          & "$env:FFMPEG_BIN_DIR\ffprobe.exe" -version

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest -v test_suite.py

      - name: Build standalone EXE smoke test
        shell: pwsh
        run: python build_exe.py --onefile

      - name: Verify standalone EXE
        shell: pwsh
        run: |
          $exe = "dist\SocialVideoDownloader_Standalone.exe"
          if (-not (Test-Path $exe)) {
            throw "Standalone EXE was not created."
          }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
