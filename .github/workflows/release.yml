name: Build & Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build standalone Windows executable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve release tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }

          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag '$tag'. Expected a value such as v1.0.0."
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install FFmpeg build dependency
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress

          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall\lib" -Recurse -Filter "ffmpeg.exe" -File |
            Where-Object { $_.Length -gt 1000000 } |
            Select-Object -First 1

          if (-not $ffmpeg) {
            throw "Could not locate the real ffmpeg.exe installed by Chocolatey."
          }

          $ffprobe = Join-Path $ffmpeg.Directory.FullName "ffprobe.exe"
          if (-not (Test-Path $ffprobe)) {
            throw "Could not locate ffprobe.exe next to ffmpeg.exe."
          }

          "FFMPEG_BIN_DIR=$($ffmpeg.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Using FFmpeg from $($ffmpeg.Directory.FullName)"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify bundled runtime sources
        shell: pwsh
        run: |
          python --version
          node --version
          & "$env:FFMPEG_BIN_DIR\ffmpeg.exe" -version
          & "$env:FFMPEG_BIN_DIR\ffprobe.exe" -version

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest -v test_suite.py

      - name: Build standalone EXE
        shell: pwsh
        run: python build_exe.py --onefile

      - name: Verify release asset
        shell: pwsh
        run: |
          $exe = "dist\SocialVideoDownloader_Standalone.exe"
          if (-not (Test-Path $exe)) {
            throw "Release executable was not created."
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SocialVideoDownloader_Standalone.exe" |
            Out-File -FilePath "dist\SHA256SUMS.txt" -Encoding ascii

          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-Content "dist\SHA256SUMS.txt"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload "$env:RELEASE_TAG" `
              "dist\SocialVideoDownloader_Standalone.exe" `
              "dist\SHA256SUMS.txt" `
              --clobber `
              --repo "$env:GITHUB_REPOSITORY"
          } else {
            if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              gh release create "$env:RELEASE_TAG" `
                "dist\SocialVideoDownloader_Standalone.exe" `
                "dist\SHA256SUMS.txt" `
                --target "$env:GITHUB_SHA" `
                --title "Social Video Downloader $env:RELEASE_TAG" `
                --generate-notes `
                --repo "$env:GITHUB_REPOSITORY"
            } else {
              gh release create "$env:RELEASE_TAG" `
                "dist\SocialVideoDownloader_Standalone.exe" `
                "dist\SHA256SUMS.txt" `
                --title "Social Video Downloader $env:RELEASE_TAG" `
                --generate-notes `
                --repo "$env:GITHUB_REPOSITORY"
            }
          }
