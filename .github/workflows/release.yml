name: Build & Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build standalone Windows executable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-release.txt

      - name: Resolve and validate release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }

          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag '$tag'. Expected a value such as v1.0.1."
          }

          $appVersion = (python -c "from version import __version__; print(__version__)").Trim()
          if ($tag -ne "v$appVersion") {
            throw "Release tag '$tag' does not match application version '$appVersion'. Update version.py first."
          }

          $releaseNotesPath = ".github/release-notes/$tag.md"
          if (-not (Test-Path $releaseNotesPath)) {
            throw "Missing curated release notes '$releaseNotesPath'. Add a user-facing release summary before publishing."
          }

          if ([string]::IsNullOrWhiteSpace((Get-Content $releaseNotesPath -Raw -Encoding utf8))) {
            throw "Curated release notes '$releaseNotesPath' are empty."
          }

          gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release '$tag' already exists. Published releases are never overwritten."
          }

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $existingTag = git ls-remote --tags origin "refs/tags/$tag"
            if ($existingTag) {
              throw "Tag '$tag' already exists. Use a new version instead of reusing an existing tag."
            }
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "notes_file=$releaseNotesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"

      - name: Install pinned FFmpeg build dependency
        shell: pwsh
        run: |
          choco install ffmpeg --version=9.0.1 -y --no-progress

          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg\tools" -Recurse -Filter "ffmpeg.exe" -File |
            Where-Object { $_.Length -gt 1000000 } |
            Select-Object -First 1

          if (-not $ffmpeg) {
            throw "Could not locate the pinned ffmpeg.exe installed by Chocolatey."
          }

          $ffprobe = Join-Path $ffmpeg.Directory.FullName "ffprobe.exe"
          if (-not (Test-Path $ffprobe)) {
            throw "Could not locate ffprobe.exe next to ffmpeg.exe."
          }

          "FFMPEG_BIN_DIR=$($ffmpeg.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned Python dependencies
        shell: pwsh
        run: |
          python -m pip --version
          pip install -r requirements-release.txt
          pip check

      - name: Verify bundled runtime sources
        shell: pwsh
        run: |
          python --version
          node --version
          & "$env:FFMPEG_BIN_DIR\ffmpeg.exe" -version
          & "$env:FFMPEG_BIN_DIR\ffprobe.exe" -version

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest -v test_suite.py

      - name: Build standalone EXE
        shell: pwsh
        run: python build_exe.py --onefile

      - name: Create checksums and build metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          $exe = "dist\SocialVideoDownloader_Standalone.exe"
          if (-not (Test-Path $exe)) {
            throw "Release executable was not created."
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SocialVideoDownloader_Standalone.exe" |
            Out-File -FilePath "dist\SHA256SUMS.txt" -Encoding ascii

          @(
            "Release tag: $env:RELEASE_TAG"
            "Application version: $env:APP_VERSION"
            "Commit: $env:GITHUB_SHA"
            "Runner image: windows-latest"
            "Python: $(python --version 2>&1)"
            "Node.js: $(node --version)"
            "FFmpeg: $((& "$env:FFMPEG_BIN_DIR\ffmpeg.exe" -version | Select-Object -First 1))"
            ""
            "Pinned Python packages:"
          ) | Out-File -FilePath "dist\BUILD-METADATA.txt" -Encoding utf8

          pip freeze | Add-Content -Path "dist\BUILD-METADATA.txt" -Encoding utf8

          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-Content "dist\SHA256SUMS.txt"

      - name: Assemble release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          CURATED_NOTES_FILE: ${{ steps.version.outputs.notes_file }}
        run: |
          $generatedJson = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$env:RELEASE_TAG" -f "target_commitish=$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub failed to generate the automatic changelog."
          }

          $generatedBody = ($generatedJson | ConvertFrom-Json).body
          $curatedBody = (Get-Content $env:CURATED_NOTES_FILE -Raw -Encoding utf8).Trim()

          @(
            $curatedBody
            ""
            "---"
            ""
            $generatedBody.Trim()
          ) | Out-File -FilePath "dist\RELEASE-NOTES.md" -Encoding utf8

          Get-Content "dist\RELEASE-NOTES.md"

      - name: Publish new GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            gh release create "$env:RELEASE_TAG" "dist\SocialVideoDownloader_Standalone.exe" "dist\SHA256SUMS.txt" "dist\BUILD-METADATA.txt" "THIRD_PARTY_NOTICES.md" --target "$env:GITHUB_SHA" --title "Social Video Downloader $env:RELEASE_TAG" --notes-file "dist\RELEASE-NOTES.md" --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "$env:RELEASE_TAG" "dist\SocialVideoDownloader_Standalone.exe" "dist\SHA256SUMS.txt" "dist\BUILD-METADATA.txt" "THIRD_PARTY_NOTICES.md" --title "Social Video Downloader $env:RELEASE_TAG" --notes-file "dist\RELEASE-NOTES.md" --repo "$env:GITHUB_REPOSITORY"
          }
